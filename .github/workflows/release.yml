name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: bun-linux-x64
            ext: ""
          - name: macos-arm64
            os: macos-latest
            target: bun-darwin-arm64
            ext: ""
          - name: windows-x64
            os: windows-latest
            target: bun-windows-x64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/database
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
        run: bunx prisma generate

      - name: Compile binary (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          bun build packages/cli/src/index.tsx \
            --compile \
            --target=${{ matrix.target }} \
            --outfile dist/eternalcode${{ matrix.ext }}

      - name: Compile binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          bun build packages/cli/src/index.tsx `
            --compile `
            --target=${{ matrix.target }} `
            --outfile dist/eternalcode${{ matrix.ext }}

      - name: Package archive (unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip -j eternalcode-${{ matrix.name }}.zip eternalcode${{ matrix.ext }}

      - name: Package archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/eternalcode${{ matrix.ext }} -DestinationPath dist/eternalcode-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eternalcode-${{ matrix.name }}
          path: dist/eternalcode-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -la artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true